name: Sync LeetHub to Main GitHub

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent simultaneous pushes
concurrency:
  group: leethub-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout spam repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token
        env:
          GH_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Token is missing!"
            exit 1
          fi
          echo "Token is available."

      - name: Push to main GitHub
        env:
          GH_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)

          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push https://github.com/VarunMurthy-07/LeetCode.git HEAD:main
